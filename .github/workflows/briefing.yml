name: 每日简报

# 说明：GitHub Actions 的 cron 只认 UTC，而澳洲东部有夏令时切换。
# 所以「两个候选 UTC 时刻」都排上，真正发不发由脚本按 BRIEFING_TIMEZONE
# 判断本地小时决定 —— 夏令时切换后自动对上，不用手动改。
#
#   早报 07:00 Melbourne = 20:00 UTC（夏令时 AEDT）/ 21:00 UTC（冬令时 AEST）
#   复盘 21:30 Melbourne = 10:30 UTC（夏令时 AEDT）/ 11:30 UTC（冬令时 AEST）

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 手动运行哪种简报
        type: choice
        options: [auto, morning, evening]
        default: auto
      force:
        description: 忽略时间窗口和「今天已发过」判断，立刻跑（调试用）
        type: boolean
        default: false
      dry_run:
        description: 只预览不推送（结果打印在日志里）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v6

      # 现在有两套闹钟（Cloudflare + GitHub 自带），可能几乎同时触发。
      # checkout 用的是「触发时的提交」，可能比另一套刚提交的去重状态旧，
      # 于是两边都以为「今天还没发过」而重复推送。这里强制同步到最新提交堵住这个竞态。
      - name: 同步到最新提交（避免用到过期的去重状态）
        run: |
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          echo "已同步到 $(git rev-parse --short HEAD)"

      - name: 准备 Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 打印当前时间（排查定时漂移用）
        run: |
          echo "UTC    : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Melbourne : $(TZ=Australia/Melbourne date '+%Y-%m-%d %H:%M:%S %a')"
          echo "触发方式: ${{ github.event_name }}"

      - name: 决定运行参数
        id: run
        run: |
          # 注意：用 REST API 触发时，GitHub 会把下面这些 input 填成「默认值」，
          # 所以绝不能靠「mode 有没有值」去判断是不是人工点击 —— 那会导致自动触发被当成人工触发。
          # 一切以显式开关为准。
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=auto; fi

          flags=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then flags="$flags --force"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "本次参数：mode=$MODE flags=${flags:-（无）}"

      - name: 生成并推送简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_EVENING: ${{ secrets.DISCORD_WEBHOOK_URL_EVENING }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_WEBHOOK_URL_EVENING: ${{ secrets.FEISHU_WEBHOOK_URL_EVENING }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          BRIEFING_TIMEZONE: ${{ vars.BRIEFING_TIMEZONE || 'Australia/Melbourne' }}
          USER_NAME: ${{ vars.USER_NAME || '老李' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
          # 推送时间的「窗口」：工作流醒来后看本地几点，不在窗口内就跳过。
          # 想改时间：改这几个 Variable + Cloudflare 的 cron（见 README「改造指南」）
          MORNING_HOUR: ${{ vars.MORNING_HOUR || '7' }}
          EVENING_HOUR: ${{ vars.EVENING_HOUR || '21' }}
          EVENING_MINUTE: ${{ vars.EVENING_MINUTE || '30' }}
          # 抓新闻时丢弃超过 N 天的旧闻（防止停更的源混进来）
          NEWS_MAX_AGE_DAYS: ${{ vars.NEWS_MAX_AGE_DAYS || '' }}
        run: node src/index.mjs --mode=${{ steps.run.outputs.mode }} ${{ steps.run.outputs.flags }}

      - name: 回写状态
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tasks
          if git diff --staged --quiet; then
            echo "状态没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(briefing): 更新状态 $(TZ=Australia/Melbourne date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: 失败时推送告警到 Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAILURE_TITLE: 每日简报任务失败
          FAILURE_DETAIL: |
            运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            触发方式：${{ github.event_name }}
        run: node src/notify-failure.mjs
