name: 每日简报

# 说明：GitHub Actions 的 cron 只认 UTC，而澳洲东部有夏令时切换。
# 所以「两个候选 UTC 时刻」都排上，真正发不发由脚本按 BRIEFING_TIMEZONE
# 判断本地小时决定 —— 夏令时切换后自动对上，不用手动改。
#
#   早报 07:00 Sydney = 20:00 UTC（夏令时 AEDT）/ 21:00 UTC（冬令时 AEST）
#   复盘 21:30 Sydney = 10:30 UTC（夏令时 AEDT）/ 11:30 UTC（冬令时 AEST）

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 手动运行哪种简报
        type: choice
        options: [auto, morning, evening]
        default: auto
      dry_run:
        description: 只预览不推送（结果打印在日志里）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 打印当前时间（排查定时漂移用）
        run: |
          echo "UTC    : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Sydney : $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M:%S %a')"
          echo "触发方式: ${{ github.event_name }}"

      - name: 决定运行参数
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "flags=--dry-run" >> "$GITHUB_OUTPUT"
            else
              echo "flags=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成并推送简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_EVENING: ${{ secrets.DISCORD_WEBHOOK_URL_EVENING }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          BRIEFING_TIMEZONE: ${{ vars.BRIEFING_TIMEZONE || 'Australia/Sydney' }}
          USER_NAME: ${{ vars.USER_NAME || '老李' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
        run: node src/index.mjs --mode=${{ steps.run.outputs.mode }} ${{ steps.run.outputs.flags }}

      - name: 回写状态
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tasks
          if git diff --staged --quiet; then
            echo "状态没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(briefing): 更新状态 $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: 失败时推送告警到 Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAILURE_TITLE: 每日简报任务失败
          FAILURE_DETAIL: |
            运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            触发方式：${{ github.event_name }}
        run: node src/notify-failure.mjs
