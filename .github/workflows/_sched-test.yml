name: _调度探针

# 临时文件：用来验证 GitHub 的 schedule 触发器在本仓库是否工作。
# 验证完会删除。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 打印触发信息
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
